name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 -m py_compile install.py companion/bundle_native.py
      - run: bash -n companion/build.sh
  native-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify isolated companion
        env:
          TAB_PALETTE_BUILD_DIR: ${{ runner.temp }}/tab-palette-build
          TAB_PALETTE_APP_OUTPUT: ''
        run: |
          bash companion/build.sh
          codesign --verify --strict "$TAB_PALETTE_BUILD_DIR/TabPaletteBundle"
